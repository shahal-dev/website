name: MD. Shahadat Hossain Shahal
role: Research Assistant — Extragalactic Astrophysics & Computational Astronomy
summary: Early-career researcher in astronomy and astrophysics with a background in computer science and research experience spanning radio astronomy, galaxy clusters, and machine learning. My work focuses on radio galaxies and AGN, multi-wavelength observations, and the connection between radio morphology and the surrounding cluster environment. I have experience working with radio, optical, and X-ray survey data, including VLA FIRST, VLASS, LoTSS, DESI Legacy Survey, and Chandra observations. My broader research interests lie in extragalactic astrophysics, particularly galaxy clusters, AGN–ICM interactions, cluster dynamics, and the formation and evolution of large-scale structure.
