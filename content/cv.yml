projects:
  - title: RGC — Radio Galaxy Classifier
    detail: Three-part radio-astronomy programme combining semi-supervised classification of VLA radio galaxies, annotation and multi-frequency dataset development, and the study of environmental effects on bent radio tails.
    supervisor: Dr Khan Muhammad Bin Asad
    items:
      - title: RGC I
        description: A semi-supervised multiclass model for VLA images.
      - title: RGC II
        description: A new annotation toolkit and multi-frequency dataset.
      - title: RGC III
        description: The effect of cluster environment on the bending of radio tails.
    compact: true
  - title: MIMIC — Galaxy Cluster X-ray Temperature Mapping
    detail: Spatially resolved analysis of the intracluster medium using Chandra observations.
    supervisor: Dr Khan Muhammad Bin Asad
    items:
      - title: Intracluster-medium mapping
        description: Produces temperature, pressure, and density maps of galaxy clusters to search for radio mini-haloes.
    compact: false
  - title: TART — Transient Array Radio Telescope
    detail: Team-based construction, installation, commissioning, and operation of Bangladesh's first radio telescope, a 24-element GPS/GNSS aperture-synthesis array at IUB CORE; visibility calibration and synthesis imaging with tart2ms and CASA.
    supervisor: Dr Khan Muhammad Bin Asad
    compact: false
  - title: Crito — Observatory Control System
    detail: Web-controlled system for coordinating automated observations across multiple observatories.
    supervisor: Syed Ashraf Uddin, PhD
    items:
      - title: Automated transient follow-up
        description: Ingests ALeRCE candidates, filters them by visibility, applies an approval gate, and controls INDI telescopes with plate-solving, autofocus, and guiding.
    compact: true
  - title: Galaxy Cluster Evolution — The Missing Middle
    detail: Follow-up investigation of galaxy-cluster dynamical states.
    supervisor: Dr Syeda Lammim Ahad
    items:
      - title: The evolving-to-evolved pathway
        description: Uses TNG-Cluster simulation data to investigate intermediate dynamical states, changes in galaxy populations and mass distributions, and connections to large-scale structure between evolving and evolved subsamples.
    compact: true
  - title: Nuptial Link
    detail: Blockchain-based marriage registration platform on Solana with e-signatures and an immutable record ledger.
    supervisor: Self-supervised
    compact: false
  - title: WiFi Intrusion Detection System
    detail: PyTorch framework classifying 14 WiFi traffic classes from the AWID3 dataset with neural and tree-based models.
    supervisor: Dr Tarem Ahmed
    compact: true

