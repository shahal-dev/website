title: "RGC — Radio Galaxy Classifier"
description: "A three-part radio-astronomy programme combining semi-supervised classification of VLA radio galaxies, annotation and multi-frequency dataset development, and the study of how cluster environments shape bent radio tails."
supervisor: "Dr Khan Muhammad Bin Asad"
items:
  - title: "RGC I"
    description: "A semi-supervised multiclass model for VLA images."
  - title: "RGC II"
    description: "A new annotation toolkit and multi-frequency dataset."
  - title: "RGC III"
    description: "The effect of cluster environment on the bending of radio tails."
tags:
  - "Deep Learning"
  - "PyTorch"
  - "e2cnn"
  - "Radio Astronomy"
date: "2025"
