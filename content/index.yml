about:
  title: "About Me"
  description: |
    I'm **Md. Shahadat Hossain Shahal**, a Computer Science and Engineering undergraduate with a minor in Astronomy & Astrophysics at Independent University, Bangladesh (IUB). My interests lie at the intersection of artificial intelligence, software engineering, and observational astronomy.

    My research focuses on applying deep learning and computer vision to astronomical data, particularly radio galaxy morphology classification and explainable AI. Beyond research, I enjoy building software that supports scientific discovery and developing tools for astrophotography and astronomical image analysis.

    When I'm not coding or conducting research, you'll find me capturing the night sky through astrophotography and sharing the wonders of astronomy through outreach. My long-term goal is to pursue a Ph.D. in Astronomy or Astrophysics and contribute to the next generation of AI-driven astronomical research.
