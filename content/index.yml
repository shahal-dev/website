faq:
  title: Frequently Asked Questions
  description: A few things people usually ask me.
  categories:
    - title: Research
      questions:
        - label: What do you actually research?
          content: |
            Radio-galaxy morphology. My thesis and the RGC project build semi-supervised deep-learning models — including equivariant CNNs — that classify bent-tail radio AGNs (Wide-Angle Tail and Narrow-Angle Tail sources) from large radio surveys. More recently I've been writing pipelines that turn Chandra X-ray observations of galaxy clusters into spatially-resolved temperature, pressure, and density maps, partly to hunt for radio mini-haloes.
        - label: Are you open to collaboration?
          content: |
            Yes. I'm happy to collaborate on machine learning for astronomical images, radio/X-ray data analysis, or instrument-control software. The fastest way to reach me is email — shahal@iub.edu.bd.
        - label: Where can I find your publications?
          content: |
            On my publications page, on Google Scholar, and via ORCID — all linked in the footer.
    - title: Engineering
      questions:
        - label: What do you build outside research?
          content: |
            Full-stack web applications — mostly TypeScript, React/Next.js or Vue, Node, and PostgreSQL — plus blockchain systems for document verification and ticketing. Recent work includes an ERP for ICCCAD, the COLOCAL platform, RateMyIUB, and a browser-based telescope control dashboard.
        - label: What is Block Lab?
          content: |
            A small team I lead, working on blockchain-based document authentication and transparent e-governance for a paperless Bangladesh. The work won a Silver Award and an Award of Distinction at the International Blockchain Olympiad.
    - title: Astrophotography
      questions:
        - label: How long have you been shooting the sky?
          content: |
            Several years now, mostly from Bangladesh — deep-sky targets like the Horsehead, M81/M82, and the Elephant's Trunk, alongside wide-field Milky Way and lunar work. You can see a selection in the gallery.
        - label: Do you teach it?
          content: |
            I share what I've learned through দূরবিন - Durbin outreach programmes and on YouTube — how to start on a budget, what gear actually matters, and how to process what you capture.
